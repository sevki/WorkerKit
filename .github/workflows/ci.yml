name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    name: Swift tests and worker-build
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        run: swift test

      # HelloWorkerCLI isn't a dependency of any test target, so `swift
      # test` above doesn't build it - built here and handed to the e2e
      # job below so its native-CLI tests (Tests/e2e/worker.test.mjs)
      # stop skipping in CI, matching what already runs locally.
      #
      # This job runs in the swift:6.4 container, but e2e runs on a plain
      # ubuntu-24.04 runner (it needs direct access to the host's Docker
      # daemon for celld, which a container job doesn't get) with no
      # Swift runtime installed - a dynamically-linked binary fails there
      # with "error while loading shared libraries: libswiftDistributed.so".
      # The Static Linux SDK (musl-based) would avoid this with a fully
      # static binary, but JavaScriptKit 0.59.0 (pinned) has no Musl
      # support in ThreadLocal.swift and gets pulled into that build
      # regardless of --product scoping, so that route is blocked for
      # now. Instead, bundle the runtime .so's this binary needs and
      # point the e2e job at them with LD_LIBRARY_PATH.
      - name: swift build HelloWorkerCLI
        run: swift build --product HelloWorkerCLI

      - uses: actions/upload-artifact@v4
        with:
          name: hello-worker-cli
          path: .build/debug/HelloWorkerCLI
          if-no-files-found: error

      - name: Bundle the Swift runtime for the e2e job's Docker-only, no-Swift runner
        run: |
          mkdir -p swift-runtime-libs
          cp /usr/lib/swift/linux/*.so swift-runtime-libs/

      - uses: actions/upload-artifact@v4
        with:
          name: swift-runtime-libs
          path: swift-runtime-libs
          if-no-files-found: error

      - name: Install the Swift SDK for WebAssembly that matches the toolchain
        run: |
          apt-get update -q && apt-get install -y -q --no-install-recommends curl ca-certificates
          tag=$(swift --version 2>&1 | grep -o 'swift-[0-9.]*-RELEASE' | head -n 1)
          test -n "$tag"
          lower=$(echo "$tag" | tr '[:upper:]' '[:lower:]')
          curl -fsSL -o /tmp/wasm-sdk.artifactbundle.tar.gz \
            "https://download.swift.org/${lower}/wasm-sdk/${tag}/${tag}_wasm.artifactbundle.tar.gz"
          swift sdk install /tmp/wasm-sdk.artifactbundle.tar.gz
          swift sdk list

      # Without --swift-sdk, so the plugin picks the SDK that matches the
      # toolchain itself.
      - name: swift package worker-build
        run: |
          swift package --allow-writing-to-package-directory worker-build -c release
          ls -l build/worker

      - uses: actions/upload-artifact@v4
        with:
          name: worker
          path: build/worker
          if-no-files-found: error

  macos:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          swift --version

      - run: swift test

  docs:
    name: DocC documentation
    runs-on: ubuntu-24.04
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4

      # warnings-as-errors catches broken doc links (a renamed symbol, a
      # dangling `<doc:...>`) at PR time, before they reach the published site.
      - name: swift package generate-documentation
        run: swift package generate-documentation --target WorkersSwift --warnings-as-errors

      - name: swift package generate-documentation (for GitHub Pages)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          swift package --allow-writing-to-directory docs \
            generate-documentation --target WorkersSwift \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path workers-swift \
            --output-path docs

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: docs

  publish-docs:
    name: Publish documentation to GitHub Pages
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    name: End-to-end (workerd and celld)
    needs: swift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install celld from its release image
        run: |
          docker pull ghcr.io/denoland/celld
          container=$(docker create ghcr.io/denoland/celld)
          docker cp "$container:/usr/local/bin/celld" /usr/local/bin/celld
          docker rm "$container"
          celld --version

      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: build/worker

      - uses: actions/download-artifact@v4
        with:
          name: hello-worker-cli
          path: .build/debug

      - uses: actions/download-artifact@v4
        with:
          name: swift-runtime-libs
          path: swift-runtime-libs

      # This runner has no Swift toolchain at all (it needs direct access
      # to the host's Docker daemon for celld, which the swift:6.4
      # container job doesn't get), so HelloWorkerCLI is dynamically
      # linked against the runtime .so's bundled above via
      # LD_LIBRARY_PATH. Artifact transport also strips the executable
      # bit, hence the chmod.
      - run: chmod +x .build/debug/HelloWorkerCLI

      - name: Run the Swift worker in workerd and celld
        env:
          E2E_RUNTIMES: workerd,celld
          WORKER_DIR: build/worker
          HELLO_CLI: .build/debug/HelloWorkerCLI
          LD_LIBRARY_PATH: ${{ github.workspace }}/swift-runtime-libs
        run: npm run test:e2e

  deploy-dry-run:
    name: Cloudflare Workers deploy dry-run
    needs: swift
    # deploy-example only ever runs on push to main, so a config mistake
    # there (like the wrangler-action default-version bug that made the
    # first real deploy fail - see PR #10) only surfaces after a merge,
    # never on the PR that introduced it. This job mirrors deploy-example
    # exactly except for the trailing --dry-run, and runs on every PR: a
    # dry run parses the exact same config and resolves the exact same
    # entry point without ever calling the Cloudflare API (no state is
    # touched), so it reproduces that class of failure before merge, not
    # after. Not gated behind CLOUDFLARE_DEPLOY_ENABLED, since it can't
    # deploy anything - only gated on the token secret actually existing,
    # so this doesn't fail every PR before Cloudflare credentials exist.
    # (`secrets` isn't available in a job- or step-level `if:` at all -
    # only in `with:`/`env:` - so route the presence check through a job
    # env var, which `if:` can read.)
    runs-on: ubuntu-24.04
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: build/worker

      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --dry-run

  deploy-example:
    name: Deploy the example worker to Cloudflare Workers
    needs: [swift, e2e, deploy-dry-run]
    # Cloudflare Workers runs on workerd itself, so this deploys the exact
    # artifact e2e already verified against real workerd/celld. Gated on a
    # repo variable (Settings > Secrets and variables > Actions > Variables
    # > CLOUDFLARE_DEPLOY_ENABLED = true) so this doesn't fail on every
    # push to main before CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: build/worker

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action's own default (3.90.0) predates wrangler.jsonc
          # support and silently finds no config at all ("Missing
          # entry-point", since it never sees `main`) - pin the version
          # actually validated locally (`wrangler deploy --dry-run`).
          wranglerVersion: "4"
